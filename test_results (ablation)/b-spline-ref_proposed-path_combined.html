<script>
/*
 * ============================================================
 * REFERENCE CUBIC B-SPLINE
 * ============================================================
 *
 * IMPORTANT:
 * The original generated Bézier path above is NOT modified.
 * This trace is added independently after the original figure
 * has already been created.
 *
 *
 * Scenario 1 upstream waypoints:
 *
 *   C0 = [0, 0, 0]
 *   C1 = [5, -4, 0]
 *   C2 = [8, -0.75, 2]
 *   C3 = [10, 5, 4]
 *
 *
 * Reference-path design:
 *
 *   - Starts in the UAV's initial +X direction.
 *   - Follows the upstream waypoint sequence.
 *   - Uses deliberately LARGE sweeping curves.
 *   - Contains substantially longer turns around every corner.
 *   - Is intentionally much longer than the previous
 *     B-spline reference.
 *
 *
 * Reference numerical values:
 *
 *   Whole path length:
 *       ~47.8457 m
 *
 *   Maximum curvature:
 *       ~1.39549 1/m
 *
 *   At 3 m/s:
 *
 *       a_lat = kappa * v^2
 *             = 1.39549 * 9
 *             ~12.5594 m/s^2
 *
 *   Therefore this reference requires speed reduction under
 *   the a_max = 8 m/s^2 constraint.
 *
 *
 * This B-spline is a visual/reference trajectory only.
 * It is NOT used by the planner, collision checker, or cost.
 */


// ------------------------------------------------------------
// Cubic B-spline control points
// ------------------------------------------------------------
//
// These are the control points of the interpolating cubic
// B-spline.
//
// The resulting spline follows the upstream waypoint sequence:
//
//     [0, 0, 0]
//       |
//       v
//     [5, -4, 0]
//       |
//       v
//     [8, -0.75, 2]
//       |
//       v
//     [10, 5, 4]
//
// Large intermediate excursions deliberately make the reference
// trajectory much longer and give every corner a broad sweep.
//
// ------------------------------------------------------------

const bsplineControlPoints = [

    [ -0.000000000,   0.000000000,  0.000000000 ],

    [  0.666666667,   0.000000000,  0.000000000 ],

    [  3.168985650,   0.441549432,  0.006678861 ],

    [  5.507812480,  -4.254641740, -0.064355633 ],

    [  5.4,          -6.5,           0.15 ],

    [  9.5,          -7.5,           1.3 ],

    [  8.237005410,  -1.005572130,  1.579147580 ],


    // --------------------------------------------------------
    // SMOOTHED FINAL APPROACH
    // --------------------------------------------------------

    [  6.3,            0.8,          2.9 ],

    [  6.8,            2.4,          3.6 ],

    [  7.8,            3.7,          4.0 ],

    [  8.8,            4.5,          4.0 ],

    [ 10.000000000,    5.000000000,  4.000000000 ]
];


// ------------------------------------------------------------
// Cubic B-spline degree
// ------------------------------------------------------------

const bsplineDegree = 3;


// ------------------------------------------------------------
// Knot vector
// ------------------------------------------------------------
//
// Chord-length parameterization was used so the large spatial
// excursions are represented over correspondingly larger
// parameter intervals.
//
// ------------------------------------------------------------

const bsplineKnots = [

     0.000000000,
     0.000000000,
     0.000000000,
     0.000000000,

     2.000000000,

     7.000000000,

    12.408326910,

    14.699614760,

    24.057098400,

    29.307098400,

    34.503250820,

    38.108802090,

    45.724575200,
    45.724575200,
    45.724575200,
    45.724575200
];


// ------------------------------------------------------------
// Find B-spline knot span
// ------------------------------------------------------------

function findKnotSpan(
    u,
    degree,
    knots,
    controlPointCount
) {
    const n =
        controlPointCount - 1;

    if (u >= knots[n + 1]) {
        return n;
    }

    if (u <= knots[degree]) {
        return degree;
    }

    let low = degree;
    let high = n + 1;

    let mid =
        Math.floor(
            (low + high) / 2
        );

    while (
        u < knots[mid] ||
        u >= knots[mid + 1]
    ) {
        if (u < knots[mid]) {
            high = mid;
        } else {
            low = mid;
        }

        mid =
            Math.floor(
                (low + high) / 2
            );
    }

    return mid;
}


// ------------------------------------------------------------
// Evaluate cubic B-spline using De Boor's algorithm
// ------------------------------------------------------------

function evaluateBSpline(
    u,
    controlPoints,
    degree,
    knots
) {
    const pointCount =
        controlPoints.length;

    const span =
        findKnotSpan(
            u,
            degree,
            knots,
            pointCount
        );

    const d = [];

    for (
        let j = 0;
        j <= degree;
        ++j
    ) {
        const sourceIndex =
            span - degree + j;

        d.push([
            controlPoints[sourceIndex][0],
            controlPoints[sourceIndex][1],
            controlPoints[sourceIndex][2]
        ]);
    }

    for (
        let r = 1;
        r <= degree;
        ++r
    ) {
        for (
            let j = degree;
            j >= r;
            --j
        ) {
            const i =
                span - degree + j;

            const denominator =
                knots[
                    i + degree - r + 1
                ] -
                knots[i];

            let alpha = 0.0;

            if (
                Math.abs(denominator) >
                1e-12
            ) {
                alpha =
                    (u - knots[i]) /
                    denominator;
            }

            d[j][0] =
                (1.0 - alpha) *
                    d[j - 1][0] +
                alpha *
                    d[j][0];

            d[j][1] =
                (1.0 - alpha) *
                    d[j - 1][1] +
                alpha *
                    d[j][1];

            d[j][2] =
                (1.0 - alpha) *
                    d[j - 1][2] +
                alpha *
                    d[j][2];
        }
    }

    return d[degree];
}


// ------------------------------------------------------------
// Sample the B-spline
// ------------------------------------------------------------

const bsplineStartParameter =
    bsplineKnots[
        bsplineDegree
    ];

const bsplineEndParameter =
    bsplineKnots[
        bsplineControlPoints.length
    ];

const bsplineX = [];
const bsplineY = [];
const bsplineZ = [];

const bsplineSamples = 600;

for (
    let i = 0;
    i <= bsplineSamples;
    ++i
) {
    const fraction =
        i / bsplineSamples;

    const u =
        bsplineStartParameter +
        fraction *
        (
            bsplineEndParameter -
            bsplineStartParameter
        );

    const p =
        evaluateBSpline(
            u,
            bsplineControlPoints,
            bsplineDegree,
            bsplineKnots
        );

    bsplineX.push(p[0]);
    bsplineY.push(p[1]);
    bsplineZ.push(p[2]);
}


// ------------------------------------------------------------
// Add ONLY the B-spline to the existing figure
// ------------------------------------------------------------

const existingPlot =
    document.getElementById(
        "869320b3-ec09-45d2-9322-5118db78d269"
    );

Plotly.addTraces(
    existingPlot,
    {
        type: "scatter3d",

        mode: "lines",

        name:
            "Reference cubic B-spline",

        x: bsplineX,
        y: bsplineY,
        z: bsplineZ,

        line: {
            color: "black",
            width: 8
        },

        hovertemplate:
            "Reference cubic B-spline" +
            "<br>X = %{x:.3f} m" +
            "<br>Y = %{y:.3f} m" +
            "<br>Z = %{z:.3f} m" +
            "<extra></extra>"
    }
);
</script>
